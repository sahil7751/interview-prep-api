server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:job_tracker_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:jobtracker}
    password: ${MYSQL_PASSWORD:jobtracker123}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

groq:
  api:
    key: ${GROQ_API_KEY:}
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    connect-timeout-ms: ${GROQ_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${GROQ_READ_TIMEOUT_MS:30000}

file:
  upload-dir: /app/uploads/resumes

logging:
  level:
    root: WARN
    com.jobtracker: INFO
    com.jobtracker.service.GroqService: INFO
  file:
    name: /app/logs/job-tracker.log

    