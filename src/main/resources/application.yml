server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/job_tracker_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: jobtracker
    password: jobtracker123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.jobtracker: DEBUG
    org.springframework.security: DEBUG



jwt:
  secret: JobTrackerSuperSecretKeyThatIsAtLeast256BitsLong!
  expiration: 86400000


