server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:job_tracker_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:jobtracker}
    password: ${MYSQL_PASSWORD:jobtracker123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:JobTrackerSuperSecretKeyThatIsAtLeast256BitsLong!}
  expiration: ${JWT_EXPIRATION:86400000}

gemini:
  api:
    key: ${GEMINI_API_KEY:your-key-here}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads/resumes}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: WARN
    com.jobtracker: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN


    